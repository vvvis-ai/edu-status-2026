name: Publish education app links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build links to the verified Worker
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload link pages only
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-bridge
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
